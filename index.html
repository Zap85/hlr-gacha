<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时空中的绘旅人攒抽计算器</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main>
      <h1>时空中的绘旅人攒抽计算器</h1>
      <p>开发测试版</p>

      <section aria-labelledby="date-section-title">
        <h2 id="date-section-title">一、日期与计算方式</h2>

        <div class="date-fields">
          <label>
            当前日期
            <input id="current-date" type="date">
          </label>
        </div>

        <fieldset>
          <legend>目标方式</legend>
          <label>
            <input type="radio" name="target-mode" value="banner" checked>
            选择卡池
          </label>
          <label>
            <input type="radio" name="target-mode" value="custom">
            自定义日期
          </label>
        </fieldset>

        <div id="banner-target-fields" class="target-fields">
          <label>
            卡池
            <select id="banner-select">
              <option value="">正在加载卡池数据…</option>
            </select>
          </label>

          <fieldset>
            <legend>计算方式</legend>
            <label>
              <input type="radio" name="banner-date-type" value="start" checked>
              按开池日
            </label>
            <label>
              <input type="radio" name="banner-date-type" value="end">
              按结束日
            </label>
          </fieldset>

          <p>卡池日期范围：<output id="banner-date-range">—</output></p>
        </div>

        <label id="custom-target-field" class="target-fields" hidden>
          自定义目标日期
          <input id="custom-target-date" type="date" disabled>
        </label>

        <dl class="date-summary">
          <div>
            <dt>实际目标日期</dt>
            <dd><output id="actual-target-date">—</output></dd>
          </div>
          <div>
            <dt>计算天数</dt>
            <dd><output id="calculated-days">—</output></dd>
          </div>
        </dl>

        <p id="date-error" class="date-error" aria-live="polite"></p>
      </section>

      <section aria-labelledby="inventory-section-title">
        <h2 id="inventory-section-title">二、库存资源</h2>

        <h3>固定资源</h3>
        <div id="fixed-inventory-fields" class="inventory-fields">
          <p>正在加载资源类型…</p>
        </div>
        <p id="inventory-error" class="inventory-error" aria-live="polite"></p>

        <h3>限时老荷兰</h3>
        <div id="timed-inventory-fields" class="inventory-fields">
          <p>正在加载资源类型…</p>
        </div>

        <h3>限定老荷兰</h3>
        <div class="limited-inventory-controls">
          <label>
            选择限定老荷兰
            <select id="limited-resource-select" disabled>
              <option value="">正在加载资源实例…</option>
            </select>
          </label>
          <label>
            数量
            <input id="limited-resource-amount" type="number" min="0" step="1" value="0" disabled>
          </label>
          <button id="add-limited-resource" type="button" disabled>添加</button>
        </div>
        <p id="limited-add-error" class="inventory-error" aria-live="polite"></p>
        <div id="limited-inventory-list" class="inventory-fields"></div>
        <p id="dynamic-inventory-error" class="inventory-error" aria-live="polite"></p>
      </section>

      <section aria-labelledby="free-accumulation-section-title">
        <h2 id="free-accumulation-section-title">三、日常收入</h2>
        <dl class="accumulation-summary">
          <div>
            <dt>每日任务</dt>
            <dd><output id="daily-task-result">—</output></dd>
          </div>
          <div>
            <dt>每周分享</dt>
            <dd><output id="weekly-share-result">—</output></dd>
          </div>
          <div>
            <dt>月签到奖励</dt>
            <dd><output id="monthly-sign-in-result">—</output></dd>
          </div>
        </dl>
        <p id="free-accumulation-error" class="date-error" aria-live="polite"></p>
      </section>
    </main>

    <script defer src="js/calculator.js"></script>
    <script defer src="js/data-loader.js"></script>
    <script defer src="js/app.js"></script>
  </body>
</html>
